# What assay needs to know about lingo. See scratch/docs/07-MUTATION.md §5.6
# for the line between what assay owns and what this file says.

# The cache is off because dune replays a preprocessing action rather than
# running it, and a replayed action writes no .muts at all.
#
# [@runtest] is there for the recorded output. The dump_* targets below diff
# against files dune copies into _build only when a test rule reads them, so a
# build of the executables alone leaves them missing after a [dune clean], and
# every dump_* target fails the baseline.
build   DUNE_CACHE=disabled dune build --instrument-with assay @default @runtest
muts    _build/assay
skip    assay.skip
arid    assay.arid
timeout 120

# Every law prints PASS and FAIL with the part in brackets after it, so a kill
# names the part rather than only the law.
fail-prefix FAIL
part-field  2

# Targets are tried in the order written and the first kill ends the mutant,
# so they are in the order they cost. The first twenty come to two and a half
# seconds between them; the last five are twenty-six seconds, and only a mutant
# nothing cheap catches ever reaches them.
#
# Each runs from its own build directory. dune runs a test there, and a law
# that reads its corpus by a relative path finds nothing anywhere else.

target law_plan         cd _build/default/test/laws && ./law_plan.exe
target law_lower        cd _build/default/test/laws && ./law_lower.exe
target law_facts        cd _build/default/test/laws && ./law_facts.exe
target law_first_follow cd _build/default/test/laws && ./law_first_follow.exe
