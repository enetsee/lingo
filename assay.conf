# The recorded output. dune runs these as its own actions rather than as
# executables, so a run that lists only the laws never reaches them, and the
# libraries they cover read as untested. Each one here runs its dumper over
# every grammar it has a recording for and fails on the first difference.

target dump_docs        cd _build/default/test/editors && ./dump_docs.exe sexp | diff -q - sexp.docs.html >/dev/null && ./dump_docs.exe json | diff -q - json.docs.html >/dev/null && ./dump_docs.exe calc | diff -q - calc.docs.html >/dev/null && ./dump_docs.exe rassoc | diff -q - rassoc.docs.html >/dev/null && ./dump_docs.exe postfix | diff -q - postfix.docs.html >/dev/null && ./dump_docs.exe shapes | diff -q - shapes.docs.html >/dev/null && ./dump_docs.exe unicode | diff -q - unicode.docs.html >/dev/null && ./dump_docs.exe recovery | diff -q - recovery.docs.html >/dev/null && ./dump_docs.exe comments | diff -q - comments.docs.html >/dev/null && ./dump_docs.exe rust | diff -q - rust.docs.html >/dev/null && ./dump_docs.exe effekt | diff -q - effekt.docs.html >/dev/null && ./dump_docs.exe wide | diff -q - wide.docs.html >/dev/null && ./dump_docs.exe ml | diff -q - ml.docs.html >/dev/null
