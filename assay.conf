# law_fuzz killed 84 mutants on 2026-09-26 that nothing cheaper caught, and 83
# of them were in lib/fuzz. It checks the fuzzer's own code and very little
# else, and it costs more than every other target together. So it runs for
# that library and no other.
covers law_fuzz         fuzz
